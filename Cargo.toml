[package]
name = "finter"
authors = ["Xi Xiao <tdxiaoxi2@gmail.com>"]
version = "0.7.1"
edition = "2021"
description = "A Tmux plugin to quickly create session for folders in configured paths."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xixiaofinland/finter"
homepage = "https://github.com/xixiaofinland/finter"
documentation = "https://docs.rs/finter"

[dependencies]
skim = { version = "5.8.0", default-features = false }
ansi-to-tui = "8.0.1"
ratatui-core = "0.1.2"
home = "0.5.5"
clap = { version = "4.4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2"
predicates = "2"
