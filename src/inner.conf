# Config for the dedicated `tmux -L finter` server that runs every project session.
# The outer tmux owns the prefix; project-level keys arrive as F12 + key (see below).
set -g default-terminal "tmux-256color"
set -g prefix None
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# The outer status bar shows sessions and agents; this one only lists the project's windows.
set -g status on
set -g status-style "fg=white,bg=black"
set -g status-left ""
set -g status-right ""
set -g status-justify centre
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-format "#I_#W"
set -g window-status-style dim
set -g window-status-current-format "#I_#W"
set -g window-status-current-style bright
set -g mouse on
set -s set-clipboard on
set -g allow-passthrough on
# Pass terminal focus in/out through to the pane: Claude Code and editors use it to
# tell whether they are being watched (notifications, redraw on return).
set -g focus-events on
set -s extended-keys on
set -s extended-keys-format csi-u
set -s escape-time 1
# Forward synchronized updates (mode 2026) to the outer tmux. Without them the
# outer tmux redraws wide characters cell by cell, and tmux 3.7 paints those
# over an open popup (the finter picker) instead of clipping them.
set -as terminal-features "tmux*:sync"
set -g history-limit 10000
set -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Outer bindings send F12 + key when the focused pane is a wrapper. F12 is never typed
# by hand, so the shell inside keeps C-a.
bind -n F12 switch-client -T finter
bind -T finter n next-window
bind -T finter p previous-window
bind -T finter = new-window -c "#{pane_current_path}"
bind -T finter l split-window -h -c "#{pane_current_path}"
bind -T finter q kill-pane
bind -T finter [ copy-mode
bind -T finter 1 select-window -t :=1
bind -T finter 2 select-window -t :=2
bind -T finter 3 select-window -t :=3
bind -T finter 4 select-window -t :=4
bind -T finter 5 select-window -t :=5
bind -T finter 6 select-window -t :=6
bind -T finter 7 select-window -t :=7
bind -T finter 8 select-window -t :=8
bind -T finter 9 select-window -t :=9
