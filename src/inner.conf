# Config for the dedicated `tmux -L finter` server that runs remote-attachable sessions.
# The outer tmux (on the laptop) owns every key; this layer only has to stay out of the way.
set -g default-terminal "tmux-256color"
set -g status off
set -g prefix None
set -g mouse on
set -s set-clipboard on
set -g allow-passthrough on
# Pass terminal focus in/out through to the pane: Claude Code and editors use it to
# tell whether they are being watched (notifications, redraw on return).
set -g focus-events on
set -s extended-keys on
set -s extended-keys-format csi-u
set -s escape-time 1
# Forward synchronized updates (mode 2026) to the outer tmux. Without them the
# outer tmux redraws wide characters cell by cell, and tmux 3.7 paints those
# over an open popup (the finter picker) instead of clipping them.
set -as terminal-features "tmux*:sync"
set -g history-limit 10000
set -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
