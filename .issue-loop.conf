# Settings for issue-loop (~/dotfiles-nix/modules/issue-loop/issue-loop.sh), which works through
# this repo's ready-for-agent issues unattended. Bash, sourced at the start of every run.

# Run in each job's fresh worktree before the agent starts, outside its sandbox: install what the
# tests need. The worktree has none of the main checkout's untracked files (no .venv,
# node_modules). Must leave tracked files alone, so use a frozen lockfile install.
SETUP='cargo fetch --locked'

# Run at the worktree's root after each round of the agent's work; the PR opens only if it passes.
TEST='cargo test --all-features --locked --offline'

# The CI check that must pass on the PR before it's merged; the loop also waits for every other
# check and stops on any red one.
# The `test` job in .github/workflows/test.yml.
TEST_CHECK=test

# How the PR is merged: merge, rebase or squash.
# Squash: history stays linear and each issue lands as one commit named after the PR.
MERGE=squash

# The branch PRs target and worktrees start from; leave it out for the repo's default branch.
# `issue-loop --base BRANCH` overrides it for one run.
# When it isn't the default branch, the loop closes each issue itself after merging, since
# GitHub only acts on "Closes #N" there.
# BASE=dev

# Hosts the sandboxed agent may reach, space-separated: where it installs packages from. GitHub
# is never on it; the script does every GitHub write.
NETWORK='index.crates.io static.crates.io'

# Unix sockets the sandboxed agent may use, space-separated; empty blocks them all. A path not
# starting with / is under the sandbox's TMPDIR, where e.g. Neovim's own RPC sockets live (needed
# by mini.test's child Neovim). Name only what the tests need: a broad rule would also reach the
# SSH agent or Docker.
UNIX_SOCKETS=''

# What the agent must never run, and why; empty when there's nothing. A ticket that needs one of
# these run is sent back to triage before any work starts.
NEVER_RUN='cargo publish, ssh to real hosts, or tmux on the default server (tmux without -L)'
NEVER_RUN_WHY='publishing to crates.io is permanent and done by CI on a version bump; real hosts and the default tmux server hold the maintainer'"'"'s live sessions'

# Who sees this repo's output, for the PR's first line ("What changes for <AUDIENCE>: ...") and
# the checker, which fails unbacked claims about the outside world in what they see.
AUDIENCE='tmux users of finter'
AUDIENCE_SEES='the finter CLI and its picker, status-bar output, README and docs/, the crates.io page'
